name: PMT Backend Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            -czf /tmp/pmt-server-release.tar.gz .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp /tmp/pmt-server-release.tar.gz \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:/data/deploy/pmt/server/releases/pmt-server-release.tar.gz"

      - name: Deploy
        run: |
          ssh "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            "sudo -n /data/deploy/scripts/deploy-pmt-server"
